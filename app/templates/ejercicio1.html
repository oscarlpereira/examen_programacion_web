<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<form method="POST">
    <h1>Calculo de compras</h1>
    <label for="nombre">Ingresa tu nombre</label>
    <input type="text" id="nombre" name="nombre" required>
    <label for="edad">Ingresa tu edad</label>
    <input type="number" id="edad" name="edad" required>
    <label for="cantidad_tarros">Ingresa cantidad de tarros de pintura a comprar:</label>
    <input type="number" id="cantidad_tarros" name="cantidad_tarros" required>
    <button>Calcular</button>
    {% if total is not none %}
    <p>Nombre del cliente: {{ nombre }}</p>
    <p>Total sin descuento: ${{ total }}</p>
    <p>El descuento es: ${{ descuento }}</p>
    <p>El total a pagar es: ${{ total_a_pagar }}</p>
    {% endif %}

</form>
</body>
</html>
